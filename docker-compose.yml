services:
  mongo:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    volumes:
      - data:/data/db
    networks:
      - app
    # No ports exposed - MongoDB only accessible within Docker network

  website:
    build: .
    # Port 3000 is not published; the global edge Nginx in ../infra reaches this service on website-net.
    expose:
      - "3000"
    depends_on:
      - mongo
    env_file:
      - .env
    environment:
      DATABASE_URL: mongodb://${MONGO_USERNAME}:${MONGO_PASSWORD}@mongo:27017/logankuzyk?authSource=admin
    networks:
      - app
      - website-net
    profiles:
      - prod

volumes:
  data:

networks:
  app: {}
  # Shared with the global edge stack (../infra) so the edge can proxy to website:3000.
  # Create once on the host: docker network create website-net
  website-net:
    external: true
