name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run generate:importmap
      - run: npm run typecheck

  media:
    name: Image decode (Docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The Dockerfile's `deps` stage already fails the build if sharp isn't the
      # from-source binding linked to the system libvips; this job proves the final
      # runtime image can actually decode the formats the pipeline accepts.
      - name: Build image
        run: docker build -t website:ci .
      - name: sharp decodes 10-bit AVIF and HEIC in the final image
        run: |
          docker run --rm -v "$PWD/scripts/verify-image-decode.mjs:/verify.mjs" \
            --entrypoint node website:ci /verify.mjs
